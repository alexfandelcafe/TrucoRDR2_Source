[Textures]
; Nombre del YTD sin la extension .ytd.
; Ejemplo: trucor2_cards.ytd -> TextureDictionary=trucor2_cards
TextureDictionary=trucor2_cards

[Controls]
; Combinacion para abrir/cerrar la mesa. Formato: modificador+tecla.
; Predeterminado: Control+F9. Evita F8 (consola) e Insert (recarga de scripts).
TableToggle=Control+F9
